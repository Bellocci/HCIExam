<p-panel [toggleable]="true" header="Filtri di ricerca" styleClass="width-full">

    <!-- Versione Standard -->
    <div *ngIf="!isMobileView()">

        <!-- Prima Riga -->
        <div class="grid">

            <!-- Selezione squadre -->
            <div class="column-4 flex flex-column">
                <div class="flex align-items-center margin-top-3 margin-bottom-3">
                    <p class="txt-base bold margin-0 margin-right-3">Squadre</p>
                    <i class="pi pi-info-circle" style="font-size: 1rem"
                        pTooltip="Se nessuna squadra è selezionata la ricerca includerà tutte le squadre">
                    </i>
                </div>
                <div class="team-multiselect-panel">
                    <p-multiSelect
                        styleClass="width-full height-full max-width-25rem"
                        [options]="teams" 
                        [(ngModel)]="selectedTeams" 
                        defaultLabel="Seleziona squadre" 
                        optionLabel="name"
                        display="chip"
                        [showClear]="true" />
                </div>
            </div>

            <!-- Budget -->
            <div class="column-3 flex flex-column">
                <p class="txt-base bold">Budget</p>
                <p-inputNumber mode="decimal"
                    [(ngModel)]="option.budget"
                    styleClass="width-full max-width-15rem" 
                    [min]="1" [step]="1"
                    [disabled]="applyAdvancedSearch" [showButtons]="true" />
            </div>

            <!-- Valutazione media squadra -->
            <div class="column-3 flex flex-column">
                <p class="txt-base bold">FMV</p>
                <p-inputNumber mode="decimal" 
                    [(ngModel)]="option.fmv"
                    styleClass="width-full max-width-15rem" 
                    [min]="0" [step]="1"
                    [disabled]="applyAdvancedSearch" [showButtons]="true" />
            </div>

            <!-- Giocatori preferiti / escludere -->
            <div class="column-2 flex flex-column">
                <p class="txt-base bold">Giocatori</p>
                <div class="flex flex-wrap row-gap-2 column-gap-2">
                    <div class="flex align-items-center">
                        <p-checkbox inputId="favoritePlayerCheckbox" styleClass="margin-right-3" />
                        <label for="favoritePlayerCheckbox">Preferiti</label>
                    </div>

                    <div class="flex align-items-center">
                        <p-checkbox inputId="excludedPlayerCheckbox" styleClass="margin-right-3" />
                        <label for="excludedPlayerCheckbox">Esclusi</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Seconda riga -->
        <div class="grid margin-top-7">

            <!-- Opzioni di ricerca avanzate -->
            <div class="column-6 flex align-items-center">
                <span class="txt-base bold margin-right-3">Opzioni avanzate</span>
                <p-inputSwitch [(ngModel)]="applyAdvancedSearch" (onChange)="checkAdvancedFilterAreIncluded()"
                    pTooltip="Applica i filtri selezionati nella pagina 'Opzioni di ricerca'" />
            </div>            

            <!-- Pulsante creazione squadra -->
            <div class="column-6 flex justify-content-end">
                <p-button styleClass="p-button-raised secondary-color no-border">
                    <span class="label weight-medium margin-right-3">Cerca giocatori</span>
                    <i class="pi pi-search" style="color: black;"></i>
                </p-button>
            </div>
        </div>

    </div>

    <!-- Versione Mobile -->
    <div *ngIf="isMobileView()">

        <!-- Prima riga -->
        <div class="grid">

            <!-- Selezione squadre -->
            <div class="column-12 flex flex-column">
                <div class="flex align-items-center margin-top-3 margin-bottom-3">
                    <p class="txt-base bold margin-0 margin-right-3">Squadre</p>
                    <i class="pi pi-info-circle" style="font-size: 1rem"
                        pTooltip="Se nessuna squadra è selezionata la ricerca includerà tutte le squadre">
                    </i>
                </div>
                <div class="team-multiselect-panel">
                    <p-multiSelect
                        styleClass="width-full height-full"
                        [options]="teams" 
                        [(ngModel)]="selectedTeams" 
                        defaultLabel="Seleziona squadre" 
                        optionLabel="name"
                        display="chip"
                        [showClear]="true" />
                </div>
            </div>

        </div>

        <!-- Seconda riga -->
        <div class="grid margin-top-3">
            <!-- Budget -->
            <div class="column-6 flex flex-column" style="min-width: 120px;">
                <p class="txt-base bold">Budget</p>
                <p-inputNumber mode="decimal" styleClass="width-full max-width-15rem" [min]="0" [step]="1"
                    [disabled]="applyAdvancedSearch" [showButtons]="true" />
            </div>

            <!-- Valutazione media squadra -->
            <div class="column-6 flex flex-column" style="min-width: 120px;">
                <p class="txt-base bold">FMV</p>
                <p-inputNumber mode="decimal" styleClass="width-full max-width-15rem" [min]="0" [step]="1"
                    [disabled]="applyAdvancedSearch" [showButtons]="true" />
            </div>
        </div>

        <!-- Terza Riga -->
        <div class="grid margin-top-3">
            <!-- Giocatori preferiti / escludere -->
            <div class="column-6 flex flex-column">
                <p class="txt-base bold">Giocatori</p>
                <div class="flex flex-wrap row-gap-2 column-gap-2">
                    <div class="flex align-items-center">
                        <p-checkbox inputId="favoritePlayerCheckbox" styleClass="margin-right-3" />
                        <label for="favoritePlayerCheckbox">Preferiti</label>
                    </div>

                    <div class="flex align-items-center">
                        <p-checkbox inputId="excludedPlayerCheckbox" styleClass="margin-right-3" />
                        <label for="excludedPlayerCheckbox">Esclusi</label>
                    </div>
                </div>
            </div>

            <!-- Opzioni di ricerca avanzate -->
            <div class="column-6 flex flex-column">
                <p class="txt-base bold">Opzioni avanzate</p>
                <p-inputSwitch [(ngModel)]="applyAdvancedSearch" (onChange)="checkAdvancedFilterAreIncluded()"
                    pTooltip="Applica i filtri selezionati nella pagina 'Opzioni di ricerca'" />
            </div>

        </div>
        
        <!-- Pulsante creazione squadra -->
        <div class="flex flex-end margin-top-3">
            <p-button styleClass="p-button-raised secondary-color no-border">
                <span class="label weight-medium margin-right-3">Cerca giocatori</span>
                <i class="pi pi-search" style="color: black;"></i>
            </p-button>
        </div>

    </div>





</p-panel>
