<p-toast [breakpoints]="{'768px' : {width: '100%', right: '0', left: '0'}}"></p-toast>
<div class="width-full">

    <ng-container *ngIf="isExtendedTableRendered()">
        <p-table #leagueDt [value]="leagues" [rows]="5" [paginator]="true" selectionMode="single"
            [(selection)]="selectedLeague" dataKey="name" [globalFilterFields]="['sport.name', 'country.name', 'name']"
            [responsive]="true" responsiveLayout="scroll">
            <ng-template pTemplate="header">
                <tr>
                    <th>Sport</th>
                    <th>Nazione</th>
                    <th>Campionato</th>
                </tr>
                <tr>
                    <th>
                        <p-columnFilter #cfSport field="sport.name" matchMode="equals" [showMenu]="false">
                            <ng-template pTemplate="filter" let-sport let-filter="filterCallback">
                                <div class="flex align-items-center">
                                    <p-dropdown [ngModel]="selectedSport" [options]="getSports()"
                                        optionLabel="description" [showClear]="true" class="max-width-10rem"
                                        (onChange)="$event.value ? onSportFilter($event.value) : filter($event.value)"
                                        placeholder="Qualunque">
                                        <ng-template let-sport pTemplate="item">
                                            <div class="flex align-items-center gap-2">
                                                <img *ngIf="isIconVisibleOnDropdownMenu()" [src]="sport.icon"
                                                    height="20" width="20">
                                                <div>{{ sport.description }}</div>
                                            </div>
                                        </ng-template>
                                    </p-dropdown>
                                </div>
                            </ng-template>
                        </p-columnFilter>
                    </th>

                    <th>
                        <p-columnFilter field="country.name" matchMode="equals" [showMenu]="false">
                            <ng-template pTemplate="filter" let-country let-filter="filterCallback">
                                <div class="flex align-items-center">
                                    <p-dropdown class="max-width-10rem" [ngModel]="selectedCountry"
                                        [options]="getCountries()" optionLabel="description" [showClear]="true"
                                        (onChange)="$event.value ? onCountryFilter($event.value) : filter($event.value)"
                                        placeholder="Qualunque">
                                        <ng-template let-country pTemplate="item">
                                            <div class="flex align-items-center gap-2">
                                                <img *ngIf="isIconVisibleOnDropdownMenu()" [src]="country.icon"
                                                    height="20" width="20">
                                                <div>{{ country.description }}</div>
                                            </div>
                                        </ng-template>
                                    </p-dropdown>
                                </div>
                            </ng-template>
                        </p-columnFilter>
                    </th>

                    <th>
                        <p-columnFilter type="text" field="name"></p-columnFilter>
                    </th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-league>
                <tr [pSelectableRow]="league" (click)="showMessage()">
                    <td>
                        <div class="flex align-items-center column-gap-2 ">
                            <img [src]="getIconSport(league.sport.name)" alt="{{ league.sport.name }}"
                                [pTooltip]="league.sport.description" tooltipPosition="bottom" height="30" width="30">

                            <span class="txt">{{league.sport.description}}</span>
                        </div>
                    </td>
                    <td>
                        <div class="flex align-items-center column-gap-2 ">
                            <img [src]="getIconCountry(league.country.name)" alt="{{ league.country.name }}"
                                [pTooltip]="league.country.description" tooltipPosition="bottom" height="30" width="30">

                            <span class="txt">{{league.country.description}}</span>
                        </div>
                    </td>
                    <td>
                        <span class="txt weight-semibold">{{league.name}}</span>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </ng-container>

    <ng-container *ngIf="!isExtendedTableRendered()">

        <p-table #leagueDt [value]="leagues" selectionMode="single"
            [(selection)]="selectedLeague" dataKey="name" [globalFilterFields]="['sport.name', 'country.name', 'name']"
            [responsive]="true" responsiveLayout="scroll" sortField="sport.name" sortMode="single"
            rowGroupMode="subheader" groupRowsBy="sport.name">

            <ng-template pTemplate="header">
                <tr>
                    <th style="width:100%;">Campionato</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="groupheader" let-league let-rowIndex="rowIndex" let-expanded="expanded">
                <tr>
                    <td colspan="5">
                        <div class="flex align-items-center">
                            <button type="button" pButton pRipple [pRowToggler]="league"
                                class="p-button-text p-button-rounded p-button-plain mr-2"
                                [icon]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'">
                            </button>
                            <img [src]="getIconSport(league.sport.name)" alt="{{ league.sport.name }}"
                                [pTooltip]="league.sport.description" tooltipPosition="bottom" height="30" width="30" />
                            <span class="txt-base weight-bold margin-left-2">
                                {{league.sport.description}}
                            </span>
                        </div>
                    </td>
                </tr>
            </ng-template>

            <ng-template pTemplate="rowexpansion" let-league>
                <tr [pSelectableRow]="league" (click)="showMessage()">
                    <td>
                        <div class="flex align-items-center column-gap-2 ">
                            <img [src]="getIconCountry(league.country.name)" alt="{{ league.country.name }}"
                                [pTooltip]="league.country.description" tooltipPosition="bottom" height="30" width="30">

                                <span class="txt-base weight-semibold">
                                    {{league.name}}
                                </span>
                        </div>
                    </td>
                    <td>
                        
                    </td>
                </tr>
            </ng-template>

        </p-table>
    </ng-container>

    <div class="flex align-content-center justify-content-end sticky bottom-0 margin-top-4">
        <p-button styleClass="p-button-raised secondary-color label no-border no-bold"
            [disabled]="selectedLeague == undefined" (onClick)="completeBtnListener()"
            [pTooltip]="getCompleteBtnTooltip()" tooltipPosition="top">
            <span class="label weight-bold">Procedi</span>
        </p-button>
    </div>
</div>
